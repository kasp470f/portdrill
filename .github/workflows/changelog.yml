name: Update Changelog

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Categorize and update changelog
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          SHORT_SHA="${MERGE_SHA:0:7}"
          REPO="${{ github.repository }}"

          ENTRY="- ([\`${SHORT_SHA}\`](https://github.com/${REPO}/commit/${MERGE_SHA})) ${PR_TITLE} - @${PR_AUTHOR} ([#${PR_NUMBER}](https://github.com/${REPO}/pull/${PR_NUMBER}))"

          # Determine section based on PR title prefix
          if echo "$PR_TITLE" | grep -iqE "^feat"; then
            SECTION="Added"
          elif echo "$PR_TITLE" | grep -iqE "^fix"; then
            SECTION="Fixed"
          else
            SECTION="Added"
          fi

          # Insert the entry under the correct section in Unreleased only
          node <<'NODE'
          const fs = require('fs');
          const path = '.github/CHANGELOG.md';
          const section = process.env.SECTION;
          const entry = process.env.ENTRY;

          const text = fs.readFileSync(path, 'utf8');
          if (text.includes(entry)) {
            console.log('Changelog entry already exists, skipping');
            process.exit(0);
          }

          const regex = new RegExp(`(## Unreleased\\n[\\s\\S]*?### ${section}\\n)`);
          const newText = text.replace(regex, (match) => match + entry + '\n');

          if (newText === text) {
            console.error(`Failed to find Unreleased > ${section}`);
            process.exit(1);
          }

          fs.writeFileSync(path, newText, 'utf8');
          NODE

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/CHANGELOG.md
          git diff --cached --quiet || git commit -m "changelog: add PR #${{ github.event.pull_request.number }}"
          git push
