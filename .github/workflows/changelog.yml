name: Update Changelog

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Categorize and update changelog
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          SHORT_SHA="${MERGE_SHA:0:7}"
          REPO="${{ github.repository }}"

          ENTRY="- ([\`${SHORT_SHA}\`](https://github.com/${REPO}/commit/${MERGE_SHA})) ${PR_TITLE} - @${PR_AUTHOR} ([#${PR_NUMBER}](https://github.com/${REPO}/pull/${PR_NUMBER}))"

          # Determine section based on PR title prefix
          if echo "$PR_TITLE" | grep -iqE "^feat"; then
            SECTION="Added"
          elif echo "$PR_TITLE" | grep -iqE "^fix"; then
            SECTION="Fixed"
          else
            SECTION="Added"
          fi

          # Export variables so child processes (node) can access them
          export ENTRY
          export SECTION

          # Insert the entry under the correct section in Unreleased only
          node <<'NODE'
          const fs = require('fs');
          const path = '.github/CHANGELOG.md';
          const section = process.env.SECTION;
          const entry = process.env.ENTRY;

          const text = fs.readFileSync(path, 'utf8');
          const eol = text.includes('\r\n') ? '\r\n' : '\n';
          if (text.includes(entry)) {
            console.log('Changelog entry already exists, skipping');
            process.exit(0);
          }

          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&');
          const sectionPattern = escapeRegExp(section);
          const regex = new RegExp(`(## Unreleased${eol}[\\s\\S]*?### ${sectionPattern}${eol})`);
          let newText = text.replace(regex, (match) => match + entry + eol);

          if (newText === text) {
            // Fallback: try inserting the section header and entry directly after '## Unreleased'
            const unreleasedRegex = new RegExp(`(## Unreleased${eol})`);
            if (unreleasedRegex.test(text)) {
              newText = text.replace(unreleasedRegex, `$1${eol}### ${section}${eol}${entry}${eol}`);
              console.log(`Fallback: inserted ${section} under Unreleased`);
            } else {
              // Ultimate fallback: prepend an Unreleased section with the entry
              newText = `## Unreleased${eol}${eol}### ${section}${eol}${entry}${eol}${text}`;
              console.log('Fallback: prepended Unreleased section and entry');
            }
          }

          fs.writeFileSync(path, newText, 'utf8');
          NODE

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/CHANGELOG.md
          git diff --cached --quiet || git commit -m "changelog: add PR #${{ github.event.pull_request.number }}"
          git push
